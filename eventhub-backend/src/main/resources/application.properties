spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.platform=mysql
spring.datasource.url=jdbc:mysql://localhost:3306/eventhub?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false

# Tajna mora imati bar 64 bajta, jer HS512 po RFC 7518 trazi kljuc duzine potpisa
jwt.secret=eventHubSecretKeyForSigningJsonWebTokensWithHmacSha512Algorithm2026
jwt.expiration=3600000

app.base-url=http://localhost:8080

# Folder u koji se snimaju otpremljene slike, relativno u odnosu na koren backend modula
app.upload-dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Adresa posiljaoca i podaci za prijavu na SMTP se citaju iz application-local.properties,
# koji se ne cuva u repozitorijumu. Vrednosti ispod su namerno prazne.
spring.config.import=optional:file:./application-local.properties

app.mail-from=
spring.mail.username=
spring.mail.password=

spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
