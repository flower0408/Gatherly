<span *ngIf="canReport">
  <button class="btn btn-link btn-sm text-decoration-none p-0 text-body-secondary"
          *ngIf="!message" (click)="toggle()">Report</button>

  <span class="small text-success" *ngIf="message">{{ message }}</span>

  <div class="card mt-2 report-panel" *ngIf="open">
    <div class="card-body p-3">
      <label class="form-label small">Why are you reporting this?</label>
      <select class="form-select form-select-sm mb-2" [(ngModel)]="reason">
        <option *ngFor="let option of reasons" [value]="option.value">{{ option.label }}</option>
      </select>

      <div class="alert alert-danger py-2 small mb-2" *ngIf="error">{{ error }}</div>

      <button class="btn btn-primary btn-sm" (click)="submit()" [disabled]="sending">
        {{ sending ? 'Sending…' : 'Send report' }}
      </button>
      <button class="btn btn-outline-secondary btn-sm ms-2" (click)="toggle()">Cancel</button>
    </div>
  </div>
</span>
