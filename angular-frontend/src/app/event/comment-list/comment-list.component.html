<div class="mt-5">
  <div class="d-flex flex-wrap align-items-center justify-content-between mb-2 gap-2">
    <h2 class="h4 mb-0">Comments <span class="text-body-secondary">({{ comments.length }})</span></h2>

    <div class="btn-group btn-group-sm" *ngIf="comments.length > 1">
      <button class="btn" [ngClass]="isSorted('date', 'desc') ? 'btn-primary' : 'btn-outline-primary'"
              (click)="sortBy('date', 'desc')">Newest</button>
      <button class="btn" [ngClass]="isSorted('date', 'asc') ? 'btn-primary' : 'btn-outline-primary'"
              (click)="sortBy('date', 'asc')">Oldest</button>
      <button class="btn" [ngClass]="isSorted('like', 'desc') ? 'btn-primary' : 'btn-outline-primary'"
              (click)="sortBy('like', 'desc')">Most liked</button>
      <button class="btn" [ngClass]="isSorted('heart', 'desc') ? 'btn-primary' : 'btn-outline-primary'"
              (click)="sortBy('heart', 'desc')">Most loved</button>
    </div>
  </div>

  <div class="alert alert-danger" *ngIf="error">{{ error }}</div>

  <div class="mb-3" *ngIf="myId !== null && canWrite">
    <textarea class="form-control mb-2" rows="3" [(ngModel)]="draft"
              placeholder="Ask something about this event…"></textarea>
    <button class="btn btn-primary" (click)="submit()" [disabled]="!draft.trim()">Post comment</button>
  </div>

  <p class="text-body-secondary" *ngIf="myId === null">
    <a [routerLink]="['/users/login']">Sign in</a> to join the conversation.
  </p>

  <p class="text-body-secondary" *ngIf="myId !== null && !canWrite">
    <a [routerLink]="['/communities', communityId]">Join this community</a> to join the conversation.
  </p>

  <p *ngIf="loading" class="text-body-secondary">Loading comments…</p>

  <p *ngIf="!loading && comments.length === 0" class="text-body-secondary">
    No comments yet.
  </p>

  <app-comment *ngFor="let comment of comments"
               [comment]="comment" [eventId]="eventId" [myId]="myId"
               [canModerate]="canModerate" [canWrite]="canWrite"
               (removed)="load()"></app-comment>
</div>
