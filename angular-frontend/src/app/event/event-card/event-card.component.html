<a class="card event-card text-decoration-none" [routerLink]="['/events', event.id]">
  <img *ngIf="coverImage" class="card-img-top" [src]="coverImage" [alt]="event.title">
  <div *ngIf="!coverImage" class="event-placeholder card-img-top">
    <span class="small">No image</span>
  </div>

  <div class="card-body">
    <div class="d-flex justify-content-between align-items-baseline gap-2 mb-1">
      <p class="event-date text-primary small mb-0">
        {{ event.startsAt | date: 'EEE, d MMM' }} &middot; {{ event.startsAt | date: 'HH:mm' }}
      </p>
      <span class="badge text-bg-light">{{ categoryLabel(event.category) }}</span>
    </div>

    <h3 class="h6 card-title text-body">{{ event.title }}</h3>

    <p class="card-text text-body-secondary small mb-2">{{ event.location }}</p>

    <div class="d-flex align-items-center gap-2">
      <span class="badge" [ngClass]="isFull ? 'text-bg-secondary' : 'text-bg-light'">
        {{ event.takenSpots }} / {{ event.capacity }} taken
      </span>
      <span class="badge text-bg-warning" *ngIf="isFull">Waiting list</span>
    </div>
  </div>
</a>
